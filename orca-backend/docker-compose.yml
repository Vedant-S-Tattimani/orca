# ORCA Backend Docker Compose
version: '3.8'

services:
  # PostGIS database for geospatial data
  db:
    image: postgis/postgis:15-3.3
    container_name: orca-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: orca_user
      POSTGRES_PASSWORD: orca_password
      POSTGRES_DB: orca_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ORCA Backend API
  backend:
    build: .
    container_name: orca-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://orca_user:orca_password@db:5432/orca_db
      - LLM_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-api-key-here}
      - INCOIS_API_KEY=${INCOIS_API_KEY:-your-incois-api-key-here}
      - IMD_API_KEY=${IMD_API_KEY:-your-imd-api-key-here}
      - ISRO_BHUVAN_API_KEY=${ISRO_BHUVAN_API_KEY:-your-isro-bhuvan-api-key-here}
    volumes:
      - ./app:/app/app
      - ./requirements.txt:/app/requirements.txt
    depends_on:
      db:
        condition: service_healthy

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: orca-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Optional: Adminer for database administration
  adminer:
    image: adminer
    container_name: orca-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
  redisdata: